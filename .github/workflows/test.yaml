name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # Pinned to commit SHAs rather than mutable tags, so a retargeted tag
      # or a compromised action repository cannot change what runs here.
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
